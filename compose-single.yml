services:
  k6:
    build: k6-image
    environment:
      K6_HOST: http://rest-fights:8082
    command: ["bash", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./k6:/k6:ro
  rest-fights:
    build:
      context: .
      dockerfile: Dockerfile
      target: rest-fights-complete
    ports:
      - "8082:8082"
