services:
  k6:
    build: k6-image
    environment:
      K6_HOST: http://rest-fights:8082
    command: ["bash", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./k6:/k6:ro
  rest-fights:
    build:
      context: .
      dockerfile: Dockerfile
      target: rest-fights-complete
    environment:
      FIGHTS_COMPLETE_DATABASE_URL: sqlite:///data/fights-complete/fights-complete.db
      HEROES_DATABASE_URL: sqlite:///data/heroes/heroes.db
      VILLAINS_DATABASE_URL: sqlite:///data/villains/villains.db
      LOCATIONS_DATABASE_URL: sqlite:///data/locations/locations.db
    tmpfs:
      - /data/fights-complete
      - /data/heroes
      - /data/villains
      - /data/locations
    ports:
      - "8082:8082"

