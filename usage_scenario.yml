        read-sci-stdout: true
  - name: K6 run 1000 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=1000 /k6/load.js
        note: Starting k6 Load Test 1000 rps
        log-stdout: true
        read-notes-stdout: true
        read-sci-stdout: true
