---
name: Superheroes Rust k6 scenario
author: Frank Lyaruu
description: Superheroes (Rust) k6 load testing scenario )
compose-file: !include compose.yml
ignore-unsupported-compose: true
services:
  k6:
    build: k6-image
    environment:
      K6_HOST: http://rest-fights:8000
    command: ["bash", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./k6:/k6:ro
flow:
  - name: K6 run 3 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=3 /k6/load.js
        note: Starting k6 Load Test 3 rps
        log-stdout: true
        read-notes-stdout: true
        read-sci-stdout: true
  - name: K6 run 30 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=30 /k6/load.js
        note: Starting k6 Load Test 30 rps
        log-stdout: true
        read-notes-stdout: true
        read-sci-stdout: true
  - name: K6 run 150 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=150 /k6/load.js
        note: Starting k6 Load Test 150 rps
        log-stdout: true
        read-notes-stdout: true
        read-sci-stdout: true
  - name: K6 run 225 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=225 /k6/load.js
        note: Starting k6 Load Test 225 rps
