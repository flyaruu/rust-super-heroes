---
name: Superheroes Rust k6 scenario
author: Frank Lyaruu
description: Superheroes (Rust) k6 load testing scenario )
compose-file: !include compose.yml
ignore-unsupported-compose: true
services:
  k6:
    build: k6-image
    environment:
      K6_HOST: http://rest-fights:8082
    command: ["bash", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./k6:/k6:ro
flow:
  - name: K6 run 10 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=10 /k6/load.js
        note: Starting k6 Load Test 10 rps
        log-stdout: true
        read-notes-stdout: true
        read-sci-stdout: true
  - name: K6 run 100 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=100 /k6/load.js
        note: Starting k6 Load Test 100 rps
        log-stdout: true
        read-notes-stdout: true
        read-sci-stdout: true
  - name: K6 run 500 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=500 /k6/load.js
        note: Starting k6 Load Test 500 rps
        log-stdout: true
        read-notes-stdout: true
        read-sci-stdout: true
  - name: K6 run 750 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=750 /k6/load.js
