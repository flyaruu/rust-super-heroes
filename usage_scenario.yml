---
name: Superheroes Rust k6 scenario
author: Frank Lyaruu
description: Superheroes (Rust) k6 load testing scenario )
compose-file: !include compose.yml
ignore-unsupported-compose: true
services:
  k6:
    build: k6-image
    environment:
      K6_HOST: http://rest-fights:8082
    command: ["bash", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./k6:/k6:ro
flow:
  - name: K6 run 5 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=5 /k6/load.js
        note: Starting k6 Load Test 5 rps
        log-stdout: true
        read-notes-stdout: true
        read-sci-stdout: true
  - name: K6 run 50 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=50 /k6/load.js
        note: Starting k6 Load Test 50 rps
        log-stdout: true
        read-notes-stdout: true
        read-sci-stdout: true
  - name: K6 run 250 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=250 /k6/load.js
        note: Starting k6 Load Test 250 rps
        log-stdout: true
        read-notes-stdout: true
        read-sci-stdout: true
  - name: K6 run 375 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=375 /k6/load.js
        note: Starting k6 Load Test 375 rps
