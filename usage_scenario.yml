---
name: Superheroes Rust k6 scenario
author: Frank Lyaruu
description: Superheroes (Rust) k6 load testing scenario )
compose-file: !include compose.yml
ignore-unsupported-compose: true
flow:
  - name: K6 run 1 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=1 /k6/load.js
        note: Starting k6 Load Test 1 rps
        log-stdout: true
        read-notes-stdout: true
        read-sci-stdout: true
  - name: K6 run 10 RPS
    container: k6
    commands:
      - type: console
        command: k6 run -e RAMPING_RATE=10 /k6/load.js
