services:
  k6:
    build: k6-image
    environment:
      K6_HOST: http://rest-fights:8000 
    command: ["bash", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./k6:/k6:ro
      - ./k6/results:/results
  rest-heroes:
    build: services/rest-heroes
    ports:
      - "8080:8000"
  rest-villains:
    build: services/rest-villains
    ports:
      - "8081:8000"
  grpc-locations:
    build: services/grpc-locations
    ports:
      - "50051:50051"
  rest-fights:
    build: services/rest-fights
    ports:
      - "8082:8000"
  locations-db:
    image: mariadb:11.5
    ports:
      - "3306:3306"
    environment:
      MARIADB_USER: locations
      MARIADB_PASSWORD: locations
      MARIADB_DATABASE: locations_database
      MARIADB_ROOT_PASSWORD: locations
      MARIADB_SKIP_TEST_DB: yes
    volumes:
      - ./database/locations-db/init/initialize-tables.sql:/docker-entrypoint-initdb.d/1-init-tables.sql
