services:
  k6:
    build: k6-image
    environment:
      K6_HOST: http://rest-fights:8082
    command: ["bash", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./k6:/k6:ro
  rest-heroes:
    build:
      context: .
      dockerfile: Dockerfile
      target: rest-heroes
    environment:
      HEROES_DATABASE_URL: sqlite:///data/heroes/heroes.db
    tmpfs:
      - /data/heroes
    ports:
      - "8080:8000"
  rest-villains:
    build:
      context: .
      dockerfile: Dockerfile
      target: rest-villains
    environment:
      VILLAINS_DATABASE_URL: sqlite:///data/villains/villains.db
    tmpfs:
      - /data/villains
    ports:
      - "8081:8000"
  grpc-locations:
    build:
      context: .
      dockerfile: Dockerfile
      target: grpc-locations
    environment:
      LOCATIONS_DATABASE_URL: sqlite:///data/locations/locations.db
    tmpfs:
      - /data/locations
    ports:
      - "50051:50051"
  rest-fights:
    build:
      context: .
      dockerfile: Dockerfile
      target: rest-fights
    environment:
      HEROES_BASE_URL: http://rest-heroes:8000
      VILLAINS_BASE_URL: http://rest-villains:8000
      LOCATIONS_BASE_URL: http://grpc-locations:50051
      FIGHTS_DATABASE_URL: sqlite:///data/fights/fights.db
    tmpfs:
      - /data/fights
    ports:
      - "8082:8082"

