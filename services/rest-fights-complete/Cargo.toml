[package]
name = "rest-fights-complete"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.1"
serde = { version = "1.0.219", features = ["alloc", "derive", "serde_derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full", "tracing"] }
superhero-types = { path = "../../lib/superhero-types" }
log = "0.4.26"
env_logger = "0.11.7"
sqlx = { version = "0.8.3", default-features = false, features = ["sqlite", "runtime-tokio"] }
rest-heroes = { path = "../rest-heroes" }
rest-villains = { path = "../rest-villains" }
grpc-locations = { path = "../grpc-locations" }
